# Single source of truth for Builder 1 dataset / index settings.
# Scripts should read these values — do not hardcode subset sizes elsewhere.

# Hugging Face dataset identity
hf_dataset: "ai4bharat/MSMARCO-XI"
# Logical language id (docs / README). The Hub currently exposes only BuilderConfig
# "default" (all languages). We load the matching parquet shard instead — see hf_data_file.
# English_passages text is the same underlying MS MARCO English across language shards.
hf_config: "hi"
hf_split: "train"
# Parquet shard for the logical hf_config (Hindi train). Avoids downloading the full default split.
hf_data_file: "train/hintrain.parquet"

# How many query rows to pull from the split before exploding passages / dedup / cap
subset_query_rows: 1000
# Hard cap on unique English passages after exact-text dedup (keeps laptop indexing fast)
max_unique_passages: 5000
# Soft floor: log a warning if unique passage count lands below this after dedup
min_unique_passages_target: 3000

paths:
  # HF / download cache lives here (gitignored)
  raw_cache_dir: "indexing/data/raw"
  # Normalized passage records directory
  processed_dir: "indexing/data/processed"
  # Final ingest output: one JSONL line per unique English passage
  processed_file: "indexing/data/processed/passages.jsonl"

qdrant:
  collection_name: "msmarco_xi"
  # Must match embedding_model output dim (all-MiniLM-L6-v2 => 384)
  vector_size: 384
  distance: "Cosine"

# Local embedding model used at index time (query-time Node side should use the same id)
embedding_model: "sentence-transformers/all-MiniLM-L6-v2"

chunking:
  fixed_overlap:
    size_chars: 512
    overlap_chars: 64
  semantic:
    max_chars: 512
  metadata_aware:
    # Prefer whole passage; only split if longer than this many characters
    split_threshold_chars: 800
  token_window:
    # ~word-sized windows (whitespace tokens); overlap keeps boundary context
    size_tokens: 80
    overlap_tokens: 16
  structure_aware:
    # Pack structural sections under this cap; fall back to paragraphs if no markers
    max_chars: 512
  recursive:
    # Hierarchical split: \n\n → \n → sentences → hard chars, then pack
    max_chars: 512
